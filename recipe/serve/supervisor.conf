[program:blackfrost_mimo_v26_flash_rl_derisked]
environment=PROC_NAME="%(program_name)s"
command=/opt/supervisor-scripts/blackfrost_mimo_v26_flash_rl_derisked.sh
autostart=false
autorestart=unexpected
startsecs=10
startretries=3
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=120
stdout_logfile=/dev/stdout
redirect_stderr=true
stdout_logfile_maxbytes=0
